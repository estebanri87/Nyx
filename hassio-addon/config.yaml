name: 'Nyx'
description: 'A modern, responsive dashboard for Home Assistant'
version: "1.20.52-v1dev"
slug: 'nyx'
url: 'https://github.com/estebanri87/Nyx'
init: false
startup: application
arch:
  - aarch64
  - amd64
homeassistant_api: true
auth_api: true
ingress: true
ingress_port: 3002
panel_icon: 'mdi:view-dashboard-variant'
panel_title: 'Nyx'
ports:
  3002/tcp: null
ports_description:
  3002/tcp: 'Nyx Web Interface (not needed when using Ingress)'
options:
  data_encryption_mode: 'off'
  data_encryption_key: ''
  data_encryption_salt: ''
schema:
  data_encryption_mode: 'list(off|dual|enc_only)?'
  data_encryption_key: 'password?'
  data_encryption_salt: 'password?'
